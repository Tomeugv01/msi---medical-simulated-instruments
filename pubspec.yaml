name: msi_medical_simulated_instruments
description: MSI - Medical Simulated Instruments
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  lucide_icons: ^0.257.0
  pdf: ^3.10.8
  printing: ^5.11.1
  flutter_reactive_ble: ^5.3.1
  permission_handler: ^11.3.1
  flutter_ble_peripheral: ^2.1.0
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1
  audio_session: ^0.1.25
  flutter_sound: ^9.4.7
  sound_stream:
    path: plugins/sound_stream
  reorderables: ^0.6.0
  wakelock_plus: ^1.6.1
  just_audio: ^0.9.37

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/audio.mp3
    - assets/sounds/audio2.mp3
    - assets/fonts/roboto_bold.ttf
    - assets/fonts/noto_color_emoji.ttf